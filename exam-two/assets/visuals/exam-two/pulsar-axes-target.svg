<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>Tilted magnetic axis and rotation axis</title><defs><radialGradient id="star" cx="32%" cy="25%"><stop stop-color="#fff4d2"/><stop offset=".45" stop-color="#f0a66a"/><stop offset=".85" stop-color="#9e4e45"/><stop offset="1" stop-color="#211b2d"/></radialGradient><radialGradient id="cold" cx="32%" cy="25%"><stop stop-color="#fff"/><stop offset=".45" stop-color="#accfe4"/><stop offset=".85" stop-color="#4c718d"/><stop offset="1" stop-color="#111e32"/></radialGradient></defs><rect width="1000" height="600" fill="#0d171f"/><g fill="#dce8ee" font-family="Arial,sans-serif" font-size="22"><text x="36" y="45" font-size="29">Magnetic pole ≠ rotation pole</text><circle cx="500" cy="300" r="215" fill="url(#cold)"/><ellipse cx="500" cy="300" rx="215" ry="58" fill="none" stroke="#7090a6" stroke-width="2"/><path d="M500 75 V540" stroke="#d4e1eb" stroke-width="4" stroke-dasharray="12 8"/><path d="M275 414 L725 186" stroke="#d4a2df" stroke-width="5"/><path d="M686 206 L845 80 L910 210 Z" fill="#d4a2df" opacity=".25"/><circle cx="690" cy="204" r="13" fill="#f0b9ec"/><text x="530" y="105">Rotation axis</text><path d="M692 208 L827 297" stroke="#e9b4eb"/><text x="775" y="328" fill="#e9b4eb">Magnetic pole</text><text x="180" y="566" font-size="19">Original lighthouse geometry; a beam must cross the observer to produce seen pulses.</text></g></svg>