<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title"><title id="title">Stellar spectral sequence</title><rect width="1000" height="530" rx="20" fill="#0c2018"/><g font-family="Arial, sans-serif"><text x="42" y="55" fill="#7edbb0" font-size="30" text-anchor="start">Stellar spectral sequence</text><circle cx="100" cy="170" r="39" fill="#74abff"/><text x="100" y="260" fill="#e9f2ee" font-size="33" text-anchor="middle">O</text><circle cx="233" cy="170" r="39" fill="#90c2ff"/><text x="233" y="260" fill="#e9f2ee" font-size="33" text-anchor="middle">B</text><circle cx="366" cy="170" r="39" fill="#dbedff"/><text x="366" y="260" fill="#e9f2ee" font-size="33" text-anchor="middle">A</text><circle cx="499" cy="170" r="39" fill="#fffada"/><text x="499" y="260" fill="#e9f2ee" font-size="33" text-anchor="middle">F</text><circle cx="632" cy="170" r="39" fill="#ffdc88"/><text x="632" y="260" fill="#e9f2ee" font-size="33" text-anchor="middle">G</text><circle cx="765" cy="170" r="39" fill="#ffb06c"/><text x="765" y="260" fill="#e9f2ee" font-size="33" text-anchor="middle">K</text><circle cx="898" cy="170" r="39" fill="#ff866c"/><text x="898" y="260" fill="#e9f2ee" font-size="33" text-anchor="middle">M</text><text x="45" y="105" fill="#6bccff" font-size="25" text-anchor="start">Hotter</text><text x="810" y="105" fill="#ff9d86" font-size="25" text-anchor="start">Cooler</text><line x1="80" y1="302" x2="915" y2="302" stroke="#b4c6bd" stroke-width="3" stroke-dasharray=""/><rect x="80" y="338" width="835" height="100" rx="16" fill="#173326" stroke="#7edbb0"/><text x="497" y="378" fill="#e9f2ee" font-size="23" text-anchor="middle">Color suggests temperature, but dust also reddens light.</text><text x="497" y="415" fill="#7edbb0" font-size="23" text-anchor="middle">Spectral lines help distinguish physical conditions.</text><text x="42" y="500" fill="#b4c6bd" font-size="18" text-anchor="start">Original teaching diagram · conceptual relationships, not to scale</text></g></svg>