<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>Pair instability physical sequence</title><defs><radialGradient id="star" cx="32%" cy="25%"><stop stop-color="#fff4d2"/><stop offset=".45" stop-color="#f0a66a"/><stop offset=".85" stop-color="#9e4e45"/><stop offset="1" stop-color="#211b2d"/></radialGradient><radialGradient id="cold" cx="32%" cy="25%"><stop stop-color="#fff"/><stop offset=".5" stop-color="#9cc8e5"/><stop offset="1" stop-color="#19334f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#72c5db"/></marker></defs><rect width="1000" height="600" fill="#0d171f"/><g fill="#dce8ee" font-family="Arial,sans-serif" font-size="22"><text x="35" y="45" font-size="28" fill="#dce8ee">Pressure loss comes before explosive burning</text><rect x="45" y="180" width="205" height="210" rx="16" fill="#1b303f" stroke="#466578"/><text x="65" y="220" font-size="26" fill="#f1bb83">1</text><text x="65" y="275" font-size="21" fill="#dce8ee">Photon energy</text><text x="65" y="315" font-size="21" fill="#dce8ee">→ pairs</text><rect x="285" y="180" width="205" height="210" rx="16" fill="#1b303f" stroke="#466578"/><text x="305" y="220" font-size="26" fill="#f1bb83">2</text><text x="305" y="275" font-size="21" fill="#dce8ee">Support</text><text x="305" y="315" font-size="21" fill="#dce8ee">weakens</text><rect x="525" y="180" width="205" height="210" rx="16" fill="#1b303f" stroke="#466578"/><text x="545" y="220" font-size="26" fill="#f1bb83">3</text><text x="545" y="275" font-size="21" fill="#dce8ee">Contraction</text><text x="545" y="315" font-size="21" fill="#dce8ee">heats the core</text><rect x="765" y="180" width="205" height="210" rx="16" fill="#1b303f" stroke="#466578"/><text x="785" y="220" font-size="26" fill="#f1bb83">4</text><text x="785" y="275" font-size="21" fill="#dce8ee">Explosive</text><text x="785" y="315" font-size="21" fill="#dce8ee">burning</text><path d="M253 285 H280" stroke="#72c5db" stroke-width="3" marker-end="url(#arrow)"/><path d="M493 285 H520" stroke="#72c5db" stroke-width="3" marker-end="url(#arrow)"/><path d="M733 285 H760" stroke="#72c5db" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="470" font-size="23" fill="#dce8ee">Full disruption is one mass/core regime; neighboring regimes differ.</text><text x="55" y="515" font-size="23" fill="#dce8ee">High luminosity alone does not identify the engine.</text><text x="35" y="575" font-size="17" fill="#dce8ee">Original causal diagram; no universal mass threshold is implied.</text></g></svg>