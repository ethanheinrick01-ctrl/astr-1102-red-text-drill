<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title"><title id="title">Annual parallax</title><rect width="1000" height="530" rx="20" fill="#0c2018"/><g font-family="Arial, sans-serif"><text x="42" y="55" fill="#7edbb0" font-size="30" text-anchor="start">Annual parallax</text><circle cx="80" cy="365" r="12" fill="#6bccff"/><text x="80" y="410" fill="#6bccff" font-size="22" text-anchor="middle">January</text><circle cx="270" cy="365" r="12" fill="#6bccff"/><text x="270" y="410" fill="#6bccff" font-size="22" text-anchor="middle">July</text><circle cx="175" cy="365" r="20" fill="#ffd16f"/><text x="175" y="410" fill="#ffd16f" font-size="22" text-anchor="middle">Sun</text><circle cx="175" cy="165" r="12" fill="#e9f2ee"/><line x1="80" y1="365" x2="175" y2="165" stroke="#b4c6bd" stroke-width="3" stroke-dasharray=""/><line x1="270" y1="365" x2="175" y2="165" stroke="#b4c6bd" stroke-width="3" stroke-dasharray=""/><line x1="175" y1="365" x2="175" y2="165" stroke="#ffd16f" stroke-width="2" stroke-dasharray="7 6"/><text x="200" y="236" fill="#ffd16f" font-size="28" text-anchor="start">p</text><text x="50" y="118" fill="#e9f2ee" font-size="22" text-anchor="start">Nearby star</text><line x1="80" y1="447" x2="270" y2="447" stroke="#7edbb0" stroke-width="3" stroke-dasharray=""/><text x="175" y="474" fill="#7edbb0" font-size="20" text-anchor="middle">2 AU baseline</text><rect x="440" y="115" width="510" height="300" rx="16" fill="#173326" stroke="#7edbb0"/><text x="470" y="170" fill="#ffd16f" font-size="30" text-anchor="start">Distance (pc) = 1 / p (arcsec)</text><text x="470" y="225" fill="#e9f2ee" font-size="27" text-anchor="start">Larger p → closer star</text><text x="470" y="273" fill="#e9f2ee" font-size="25" text-anchor="start">Full six-month shift = 2p</text><text x="470" y="324" fill="#e9f2ee" font-size="22" text-anchor="start">Reference: distant background stars</text><text x="470" y="375" fill="#b4c6bd" font-size="21" text-anchor="start">Repeat observations to separate motion.</text><text x="42" y="500" fill="#b4c6bd" font-size="18" text-anchor="start">Original teaching diagram · conceptual relationships, not to scale</text></g></svg>