<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>Pulse period and repetition rate</title><defs><radialGradient id="star" cx="32%" cy="25%"><stop stop-color="#fff4d2"/><stop offset=".45" stop-color="#f0a66a"/><stop offset=".85" stop-color="#9e4e45"/><stop offset="1" stop-color="#211b2d"/></radialGradient><radialGradient id="cold" cx="32%" cy="25%"><stop stop-color="#fff"/><stop offset=".45" stop-color="#accfe4"/><stop offset=".85" stop-color="#4c718d"/><stop offset="1" stop-color="#111e32"/></radialGradient></defs><rect width="1000" height="600" fill="#0d171f"/><g fill="#dce8ee" font-family="Arial,sans-serif" font-size="22"><text x="42" y="52" font-size="30">Shorter period → more cycles each second</text><text x="45" y="100">Period P</text><text x="755" y="100">Frequency 1/P</text><text x="45" y="170">0.714 s</text><rect x="240" y="143" width="560.0" height="35" rx="9" fill="#6f8ba8"/><text x="755" y="170">1.4 Hz</text><text x="45" y="264">0.35 s</text><rect x="240" y="237" width="490.37925076760257" height="35" rx="9" fill="#6ba8bb"/><text x="755" y="264">2.9 Hz</text><text x="45" y="358">0.033 s</text><rect x="240" y="331" width="259.7820653405218" height="35" rx="9" fill="#7fc1c6"/><text x="755" y="358">30.3 Hz</text><text x="45" y="452">0.0058 s</text><rect x="240" y="425" width="90.0" height="35" rx="9" fill="#e6b37f"/><text x="755" y="452">172.4 Hz</text><text x="45" y="565" font-size="18">Original comparison; bar lengths use a logarithmic period scale, not a common pulse time trace.</text></g></svg>