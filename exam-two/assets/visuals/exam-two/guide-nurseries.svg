<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title"><title id="title">Where stars begin</title><rect width="1000" height="530" rx="20" fill="#0c2018"/><g font-family="Arial, sans-serif"><text x="42" y="55" fill="#7edbb0" font-size="30" text-anchor="start">Where stars begin</text><rect x="45" y="118" width="425" height="292" rx="16" fill="#173326" stroke="#7edbb0"/><text x="258" y="162" fill="#7edbb0" font-size="29" text-anchor="middle">Molecular clouds</text><circle cx="180" cy="255" r="50" fill="#465747"/><circle cx="235" cy="255" r="65" fill="#465747"/><circle cx="290" cy="270" r="55" fill="#465747"/><circle cx="238" cy="310" r="51" fill="#465747"/><circle cx="254" cy="262" r="24" fill="#08150f"/><text x="258" y="385" fill="#e9f2ee" font-size="21" text-anchor="middle">Dense dark knot: Bok globule</text><rect x="520" y="118" width="430" height="292" rx="16" fill="#173326" stroke="#7edbb0"/><text x="735" y="162" fill="#7edbb0" font-size="28" text-anchor="middle">Young-star outflows</text><circle cx="735" cy="276" r="20" fill="#ffd16f"/><line x1="625" y1="276" x2="708" y2="276" stroke="#6bccff" stroke-width="10" stroke-dasharray=""/><line x1="762" y1="276" x2="849" y2="276" stroke="#ff9d86" stroke-width="10" stroke-dasharray=""/><circle cx="598" cy="276" r="12" fill="#6bccff"/><circle cx="875" cy="276" r="12" fill="#ff9d86"/><text x="735" y="385" fill="#e9f2ee" font-size="21" text-anchor="middle">Jets can produce Herbig–Haro shocks</text><text x="500" y="454" fill="#ffd16f" font-size="25" text-anchor="middle">Orion is a nearby example of a stellar nursery.</text><text x="42" y="500" fill="#b4c6bd" font-size="18" text-anchor="start">Original teaching diagram · conceptual relationships, not to scale</text></g></svg>