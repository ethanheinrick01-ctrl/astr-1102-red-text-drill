<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>Donor, stream, disk and accretor</title><defs><radialGradient id="star" cx="32%" cy="25%"><stop stop-color="#fff4d2"/><stop offset=".45" stop-color="#f0a66a"/><stop offset=".85" stop-color="#9e4e45"/><stop offset="1" stop-color="#211b2d"/></radialGradient><radialGradient id="cold" cx="32%" cy="25%"><stop stop-color="#fff"/><stop offset=".5" stop-color="#9cc8e5"/><stop offset="1" stop-color="#19334f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#72c5db"/></marker></defs><rect width="1000" height="600" fill="#0d171f"/><g fill="#dce8ee" font-family="Arial,sans-serif" font-size="22"><text x="35" y="45" font-size="29" fill="#dce8ee">Angular momentum shapes the transferred flow</text><path d="M75 300 C75 60 400 90 455 300 C400 510 75 540 75 300Z" fill="url(#star)"/><path d="M75 300 C75 60 400 90 455 300 C400 510 75 540 75 300 M455 300 C520 130 860 130 860 300 C860 470 520 470 455 300" stroke="#6c8296" stroke-width="2" stroke-dasharray="9 7" fill="none"/><ellipse cx="700" cy="315" rx="130" ry="65" fill="#466578"/><ellipse cx="700" cy="315" rx="95" ry="42" fill="none" stroke="#7ca3b7" stroke-width="10"/><circle cx="700" cy="315" r="20" fill="url(#cold)"/><path d="M455 300 Q490 307 520 320 Q550 330 575 338" fill="none" stroke="#f1bb83" stroke-width="9"/><circle cx="577" cy="338" r="12" fill="#ffe3a1"/><text x="140" y="470" font-size="22" fill="#dce8ee">Donor loses gas</text><text x="630" y="470" font-size="22" fill="#dce8ee">White dwarf</text><text x="620" y="500" font-size="22" fill="#dce8ee">at disk center</text><text x="410" y="225" font-size="18" fill="#dce8ee">Inner-point region</text><text x="455" y="405" font-size="18" fill="#dce8ee">Stream impact</text><text x="35" y="565" font-size="17" fill="#dce8ee">Critical potential outlines are schematic; disk shown in perspective.</text></g></svg>