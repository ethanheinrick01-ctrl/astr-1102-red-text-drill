<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title"><title id="title">Five magnitude steps = factor of 100</title><rect width="1000" height="530" rx="20" fill="#0c2018"/><g font-family="Arial, sans-serif"><text x="42" y="55" fill="#7edbb0" font-size="30" text-anchor="start">Five magnitude steps = factor of 100</text><line x1="110" y1="160" x2="870" y2="160" stroke="#7edbb0" stroke-width="5" stroke-dasharray=""/><circle cx="110" cy="160" r="9" fill="#7edbb0"/><text x="110" y="122" fill="#e9f2ee" font-size="29" text-anchor="middle">0</text><text x="110" y="212" fill="#ffd16f" font-size="24" text-anchor="middle">100</text><circle cx="262" cy="160" r="9" fill="#7edbb0"/><text x="262" y="122" fill="#e9f2ee" font-size="29" text-anchor="middle">1</text><text x="262" y="212" fill="#ffd16f" font-size="24" text-anchor="middle">39.8</text><circle cx="414" cy="160" r="9" fill="#7edbb0"/><text x="414" y="122" fill="#e9f2ee" font-size="29" text-anchor="middle">2</text><text x="414" y="212" fill="#ffd16f" font-size="24" text-anchor="middle">15.8</text><circle cx="566" cy="160" r="9" fill="#7edbb0"/><text x="566" y="122" fill="#e9f2ee" font-size="29" text-anchor="middle">3</text><text x="566" y="212" fill="#ffd16f" font-size="24" text-anchor="middle">6.31</text><circle cx="718" cy="160" r="9" fill="#7edbb0"/><text x="718" y="122" fill="#e9f2ee" font-size="29" text-anchor="middle">4</text><text x="718" y="212" fill="#ffd16f" font-size="24" text-anchor="middle">2.51</text><circle cx="870" cy="160" r="9" fill="#7edbb0"/><text x="870" y="122" fill="#e9f2ee" font-size="29" text-anchor="middle">5</text><text x="870" y="212" fill="#ffd16f" font-size="24" text-anchor="middle">1</text><text x="50" y="260" fill="#6bccff" font-size="24" text-anchor="start">Lower magnitude: brighter</text><text x="600" y="260" fill="#ff9d86" font-size="24" text-anchor="start">Higher magnitude: fainter</text><text x="500" y="318" fill="#b4c6bd" font-size="21" text-anchor="middle">Relative brightness shown below each magnitude</text><rect x="130" y="355" width="740" height="95" rx="16" fill="#173326" stroke="#7edbb0"/><text x="500" y="393" fill="#e9f2ee" font-size="24" text-anchor="middle">Apparent: as seen from Earth</text><text x="500" y="429" fill="#7edbb0" font-size="24" text-anchor="middle">Absolute: as it would appear at 10 parsecs</text><text x="42" y="500" fill="#b4c6bd" font-size="18" text-anchor="start">Original teaching diagram · conceptual relationships, not to scale</text></g></svg>