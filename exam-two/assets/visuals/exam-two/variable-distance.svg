<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><radialGradient id="star" cx="35%" cy="30%"><stop stop-color="#fff6ce"/><stop offset=".6" stop-color="#ffc04f"/><stop offset="1" stop-color="#b84216"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#72d4e0"/></marker></defs><rect width="1000" height="640" rx="20" fill="#101820"/><g font-family="Arial,sans-serif" fill="#e9f1f5"><text x="70" y="75" font-size="37" fill="#e9f1f5" >A clock becomes a distance marker</text><circle cx="195" cy="265" r="82" fill="url(#star)"/><text x="90" y="405" font-size="26" fill="#e9f1f5" >Pulsating Cepheid</text><text x="390" y="175" font-size="29" fill="#72d4e0" >1. Measure repeated period</text><text x="390" y="260" font-size="27" fill="#72d4e0" >2. Use the correct type’s calibration</text><text x="390" y="345" font-size="29" fill="#72d4e0" >3. Infer intrinsic luminosity</text><text x="390" y="430" font-size="29" fill="#72d4e0" >4. Compare apparent brightness</text><text x="70" y="545" font-size="23" fill="#a6bdca" >At equal calibrated luminosity and negligible extinction:</text><text x="70" y="598" font-size="30" fill="#ffc765" >b ∝ 1/d²:  four times fainter → twice as far</text></g></svg>