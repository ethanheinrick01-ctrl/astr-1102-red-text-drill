<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title"><title id="title">Interstellar gas and dust</title><rect width="1000" height="530" rx="20" fill="#0c2018"/><g font-family="Arial, sans-serif"><text x="42" y="55" fill="#7edbb0" font-size="30" text-anchor="start">Interstellar gas and dust</text><rect x="45" y="130" width="270" height="265" rx="16" fill="#173326" stroke="#7edbb0"/><circle cx="180" cy="214" r="44" fill="#ff9d86"/><text x="180" y="293" fill="#e9f2ee" font-size="25" text-anchor="middle">Emission</text><text x="180" y="350" fill="#b4c6bd" font-size="20" text-anchor="middle">Ionized gas emits</text><rect x="365" y="130" width="270" height="265" rx="16" fill="#173326" stroke="#7edbb0"/><circle cx="500" cy="214" r="44" fill="#6bccff"/><text x="500" y="293" fill="#e9f2ee" font-size="25" text-anchor="middle">Reflection</text><text x="500" y="350" fill="#b4c6bd" font-size="20" text-anchor="middle">Dust scatters light</text><rect x="685" y="130" width="270" height="265" rx="16" fill="#173326" stroke="#7edbb0"/><circle cx="820" cy="214" r="44" fill="#b4c6bd"/><text x="820" y="293" fill="#e9f2ee" font-size="25" text-anchor="middle">Dark cloud</text><text x="820" y="350" fill="#b4c6bd" font-size="20" text-anchor="middle">Dust obscures light</text><text x="500" y="450" fill="#ffd16f" font-size="25" text-anchor="middle">H I: neutral H • H II: ionized H • H₂: molecular H</text><text x="42" y="500" fill="#b4c6bd" font-size="18" text-anchor="start">Original teaching diagram · conceptual relationships, not to scale</text></g></svg>