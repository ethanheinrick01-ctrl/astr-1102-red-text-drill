<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><radialGradient id="star" cx="35%" cy="30%"><stop stop-color="#fff6ce"/><stop offset=".6" stop-color="#ffc04f"/><stop offset="1" stop-color="#b84216"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#72d4e0"/></marker></defs><rect width="1000" height="640" rx="20" fill="#101820"/><g font-family="Arial,sans-serif" fill="#e9f1f5"><text x="80" y="80" font-size="38" fill="#e9f1f5" >Two reservoirs, two clocks</text><text x="80" y="170" font-size="26" fill="#a6bdca" >Before sustained core hydrogen fusion</text><text x="80" y="230" font-size="30" fill="#e9f1f5" >Gravitational contraction</text><text x="80" y="295" font-size="40" fill="#72d4e0" >tKH ≈ GM² / (R L)</text><text x="80" y="350" font-size="23" fill="#e9f1f5" >Energy reservoir ÷ luminosity</text><text x="80" y="445" font-size="26" fill="#a6bdca" >During core hydrogen fusion</text><text x="80" y="505" font-size="30" fill="#ffc765" >tMS / tSun ≈ (M / MSun) / (L / LSun)</text><circle cx="790" cy="260" r="105" fill="url(#star)"/><path d="M690 260H745M890 260H835" stroke="#72d4e0" stroke-width="8" marker-end="url(#arrow)"/><text x="655" y="410" font-size="22" fill="#e9f1f5" >Contraction heats the interior</text><text x="80" y="590" font-size="22" fill="#a6bdca" >Ratio comparisons hold the other stated variables fixed.</text></g></svg>