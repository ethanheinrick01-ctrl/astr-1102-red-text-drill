<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img"><style>text{font-family:system-ui,sans-serif;fill:#dce8f2} .muted{fill:#b5bdc7} .accent{fill:#79cbff} .small{font-size:17px}</style><rect width="720" height="500" rx="18" fill="#0b111a"/><text x="32" y="36" font-size="24" font-weight="700">Four possible cloud regions</text><text x="32" y="65" class="small muted">Comparable cloud size and composition</text><rect x="30" y="95" width="300" height="150" rx="18" fill="#141e2b" stroke="#566476"/><circle cx="180" cy="155" r="30" fill="#243a50" stroke="#79cbff"/><text x="180" y="163" text-anchor="middle" font-size="24">A</text><text x="180" y="211" text-anchor="middle" class="small">20 K · 50 particles/cm³</text><rect x="390" y="95" width="300" height="150" rx="18" fill="#141e2b" stroke="#566476"/><circle cx="540" cy="155" r="30" fill="#243a50" stroke="#79cbff"/><text x="540" y="163" text-anchor="middle" font-size="24">B</text><text x="540" y="211" text-anchor="middle" class="small">10 K · 2,000 particles/cm³</text><rect x="30" y="305" width="300" height="150" rx="18" fill="#141e2b" stroke="#566476"/><circle cx="180" cy="365" r="30" fill="#243a50" stroke="#79cbff"/><text x="180" y="373" text-anchor="middle" font-size="24">C</text><text x="180" y="421" text-anchor="middle" class="small">80 K · 30 particles/cm³</text><rect x="390" y="305" width="300" height="150" rx="18" fill="#141e2b" stroke="#566476"/><circle cx="540" cy="365" r="30" fill="#243a50" stroke="#79cbff"/><text x="540" y="373" text-anchor="middle" font-size="24">D</text><text x="540" y="421" text-anchor="middle" class="small">80 K · 1,000 particles/cm³</text><text x="360" y="484" text-anchor="middle" class="small muted">Compare both temperature and density.</text></svg>