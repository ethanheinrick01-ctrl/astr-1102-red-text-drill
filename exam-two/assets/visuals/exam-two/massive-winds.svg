<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><radialGradient id="core"><stop stop-color="#fff"/><stop offset=".4" stop-color="#d4e9ff"/><stop offset="1" stop-color="#6789af"/></radialGradient><radialGradient id="gas"><stop stop-color="#0f171d"/><stop offset=".68" stop-color="#173847"/><stop offset=".82" stop-color="#5297ac"/><stop offset=".9" stop-color="#305c6e"/><stop offset="1" stop-color="#101820"/></radialGradient></defs><rect width="1000" height="640" rx="20" fill="#101820"/><g font-family="Arial,sans-serif"><text x="60" y="65" font-size="32" fill="#e8f0f5" text-anchor="start">Mass loss changes the star and its surroundings</text><circle cx="295" cy="300" r="95" fill="url(#core)"/><circle cx="295" cy="300" r="130" fill="none" stroke="#72d4e0" stroke-opacity="0.7" stroke-width="4"/><circle cx="295" cy="300" r="180" fill="none" stroke="#72d4e0" stroke-opacity="0.45" stroke-width="12"/><circle cx="295" cy="300" r="235" fill="none" stroke="#72d4e0" stroke-opacity="0.25" stroke-width="22"/><text x="610" y="220" font-size="27" fill="#e8f0f5" text-anchor="start">High luminosity drives a wind</text><text x="610" y="310" font-size="27" fill="#e8f0f5" text-anchor="start">Earlier ejecta stay outside</text><text x="610" y="400" font-size="23" fill="#e8f0f5" text-anchor="start">Envelope loss exposes deeper layers</text><text x="60" y="600" font-size="24" fill="#a7bbc7" text-anchor="start">Later explosion ejecta can encounter gas expelled long before the explosion.</text></g></svg>