<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>Equal calibrated luminosity and inverse square brightness</title><defs><radialGradient id="star" cx="32%" cy="25%"><stop stop-color="#fff4d2"/><stop offset=".45" stop-color="#f0a66a"/><stop offset=".85" stop-color="#9e4e45"/><stop offset="1" stop-color="#211b2d"/></radialGradient><radialGradient id="cold" cx="32%" cy="25%"><stop stop-color="#fff"/><stop offset=".5" stop-color="#9cc8e5"/><stop offset="1" stop-color="#19334f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#72c5db"/></marker></defs><rect width="1000" height="600" fill="#0d171f"/><g fill="#dce8ee" font-family="Arial,sans-serif" font-size="22"><text x="35" y="45" font-size="28" fill="#dce8ee">Calibrate first, then compare received brightness</text><circle cx="150" cy="280" r="32" fill="url(#star)"/><circle cx="150" cy="430" r="32" fill="url(#star)"/><path d="M185 280 H425 M185 430 H825" stroke="#72c5db" stroke-width="3" marker-end="url(#arrow)"/><circle cx="450" cy="280" r="18" fill="url(#cold)"/><circle cx="850" cy="430" r="18" fill="url(#cold)"/><text x="220" y="245" font-size="22" fill="#dce8ee">Distance d · brightness F</text><text x="300" y="395" font-size="22" fill="#dce8ee">Distance 4d · brightness F / 16</text><text x="50" y="130" font-size="22" fill="#dce8ee">Equal calibrated luminosities; negligible extinction</text><text x="35" y="550" font-size="23" fill="#dce8ee">F ∝ L / d²     Dust and intrinsic differences change the inference.</text><text x="35" y="585" font-size="16" fill="#dce8ee">Original comparison; horizontal distances are illustrative.</text></g></svg>