<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img"><style>text{font-family:system-ui,sans-serif;fill:#dce8f2} .muted{fill:#b5bdc7} .accent{fill:#79cbff} .small{font-size:17px}</style><rect width="720" height="500" rx="18" fill="#0b111a"/><text x="30" y="40" font-size="25" font-weight="700">Contraction, heating and cooling</text><text x="30" y="70" class="small muted">Before sustained core hydrogen fusion</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#79cbff"/></marker></defs><circle cx="120" cy="180" r="65" fill="#59383d" stroke="#e6ac7b" stroke-width="2"/><text x="120" y="285" text-anchor="middle" font-size="20">Larger</text><circle cx="355" cy="180" r="46" fill="#59383d" stroke="#e6ac7b" stroke-width="2"/><text x="355" y="285" text-anchor="middle" font-size="20">Smaller</text><circle cx="605" cy="180" r="32" fill="#59383d" stroke="#e6ac7b" stroke-width="2"/><text x="605" y="285" text-anchor="middle" font-size="20">Smaller still</text><path d="M200 180H288" stroke="#79cbff" stroke-width="3" marker-end="url(#arrow)"/><path d="M423 180H553" stroke="#79cbff" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="127" text-anchor="middle" class="small accent">Contracts</text><text x="490" y="112" text-anchor="middle" class="small accent">Loses heat;</text><text x="490" y="138" text-anchor="middle" class="small accent">can contract again</text><rect x="30" y="325" width="660" height="140" rx="14" fill="#141e2b"/><text x="50" y="358" class="small">Contraction releases gravitational energy as heat and radiation.</text><text x="50" y="390" class="small">Radiative cooling can reduce thermal pressure support.</text><text x="50" y="422" class="small">Long-term heating must replace energy escaping as light.</text><text x="50" y="451" class="small muted">Interior heating is distinct from surface temperature and luminosity.</text></svg>