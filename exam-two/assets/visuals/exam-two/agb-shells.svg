<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><radialGradient id="core"><stop stop-color="#fff"/><stop offset=".4" stop-color="#d4e9ff"/><stop offset="1" stop-color="#6789af"/></radialGradient><radialGradient id="gas"><stop stop-color="#0f171d"/><stop offset=".68" stop-color="#173847"/><stop offset=".82" stop-color="#5297ac"/><stop offset=".9" stop-color="#305c6e"/><stop offset="1" stop-color="#101820"/></radialGradient></defs><rect width="1000" height="640" rx="20" fill="#101820"/><g font-family="Arial,sans-serif"><text x="60" y="65" font-size="36" fill="#e8f0f5" text-anchor="start">Inside an AGB star</text><circle cx="310" cy="330" r="215" fill="#ab4f36"/><circle cx="310" cy="330" r="125" fill="#e8a847"/><circle cx="310" cy="330" r="92" fill="#c5a5dc"/><circle cx="310" cy="330" r="60" fill="url(#core)"/><text x="590" y="205" font-size="26" fill="#e8f0f5" text-anchor="start">Carbon–oxygen core: inert</text><text x="590" y="285" font-size="26" fill="#e8f0f5" text-anchor="start">Inner burning shell: helium</text><text x="590" y="365" font-size="26" fill="#e8f0f5" text-anchor="start">Outer burning shell: hydrogen</text><text x="590" y="445" font-size="26" fill="#e8f0f5" text-anchor="start">Extended convective envelope</text><text x="60" y="605" font-size="24" fill="#a7bbc7" text-anchor="start">Helium fusion → carbon · convection → surface · wind → interstellar gas</text><path d="M310 330L570 198" fill="none" stroke="#a7bbc7" stroke-width="2"/><path d="M395 330L570 278" fill="none" stroke="#a7bbc7" stroke-width="2"/><path d="M432 330L570 358" fill="none" stroke="#a7bbc7" stroke-width="2"/><path d="M480 400L570 438" fill="none" stroke="#a7bbc7" stroke-width="2"/></g></svg>