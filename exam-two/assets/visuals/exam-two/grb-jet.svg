<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>Two jets and observer directions</title><defs><radialGradient id="star" cx="32%" cy="25%"><stop stop-color="#fff4d2"/><stop offset=".45" stop-color="#f0a66a"/><stop offset=".85" stop-color="#9e4e45"/><stop offset="1" stop-color="#211b2d"/></radialGradient><radialGradient id="cold" cx="32%" cy="25%"><stop stop-color="#fff"/><stop offset=".5" stop-color="#9cc8e5"/><stop offset="1" stop-color="#19334f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#72c5db"/></marker></defs><rect width="1000" height="600" fill="#0d171f"/><g fill="#dce8ee" font-family="Arial,sans-serif" font-size="22"><text x="35" y="42" font-size="28" fill="#dce8ee">Prompt radiation is concentrated into jets</text><path d="M500 330 L350 70 L650 70 Z M500 330 L425 550 L575 550 Z" fill="#bd93d7" opacity=".5"/><circle cx="500" cy="330" r="30" fill="url(#cold)"/><path d="M500 290 V78 M500 370 V545" stroke="#ddafea" stroke-width="4" marker-end="url(#arrow)"/><text x="680" y="170" font-size="22" fill="#dce8ee">Upper cone</text><text x="670" y="210" font-size="22" fill="#dce8ee"></text><text x="650" y="400" font-size="22" fill="#dce8ee">Off-axis observers can miss</text><text x="650" y="435" font-size="22" fill="#dce8ee">the prompt gamma rays.</text><text x="35" y="570" font-size="17" fill="#dce8ee">Target markers are provided by the question. Original geometry; not to scale.</text></g></svg>