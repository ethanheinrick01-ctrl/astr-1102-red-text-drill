<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img"><style>text{font-family:system-ui,sans-serif;fill:#dce8f2} .muted{fill:#b5bdc7} .accent{fill:#79cbff} .small{font-size:17px}</style><rect width="720" height="500" rx="18" fill="#0b111a"/><text x="30" y="40" font-size="25" font-weight="700">From dense core to young stellar system</text><text x="30" y="70" class="small muted">Original schematic of the supplied six-stage sequence</text><rect x="30" y="105" width="200" height="140" rx="14" fill="#141e2b" stroke="#566476"/><text x="130" y="205" text-anchor="middle" class="small">1. Dense dark</text><text x="130" y="228" text-anchor="middle" class="small">cloud core</text><ellipse cx="130" cy="147" rx="43" ry="29" fill="#334b64"/><rect x="260" y="105" width="200" height="140" rx="14" fill="#141e2b" stroke="#566476"/><text x="360" y="205" text-anchor="middle" class="small">2. Gravitational</text><text x="360" y="228" text-anchor="middle" class="small">collapse</text><circle cx="360" cy="147" r="24" fill="#56778c"/><path d="M313 147h15 M407 147h-15" stroke="#79cbff" stroke-width="3"/><rect x="490" y="105" width="200" height="140" rx="14" fill="#141e2b" stroke="#566476"/><text x="590" y="205" text-anchor="middle" class="small">3. Protostar: disk</text><text x="590" y="228" text-anchor="middle" class="small">and bipolar flow</text><ellipse cx="590" cy="148" rx="48" ry="13" fill="none" stroke="#79cbff" stroke-width="2"/><circle cx="590" cy="148" r="13" fill="#edbb77"/><path d="M590 115v14 M590 167v14" stroke="#a88ce9" stroke-width="4"/><rect x="30" y="270" width="200" height="140" rx="14" fill="#141e2b" stroke="#566476"/><text x="130" y="370" text-anchor="middle" class="small">4. T Tauri</text><text x="130" y="393" text-anchor="middle" class="small">stage</text><ellipse cx="130" cy="313" rx="48" ry="13" fill="none" stroke="#79cbff" stroke-width="2"/><circle cx="130" cy="313" r="13" fill="#edbb77"/><path d="M130 280v14 M130 332v14" stroke="#a88ce9" stroke-width="4"/><rect x="260" y="270" width="200" height="140" rx="14" fill="#141e2b" stroke="#566476"/><text x="360" y="370" text-anchor="middle" class="small">5. Pre-main-sequence</text><text x="360" y="393" text-anchor="middle" class="small">star; remaining disk</text><ellipse cx="360" cy="313" rx="48" ry="13" fill="none" stroke="#79cbff" stroke-width="2"/><circle cx="360" cy="313" r="13" fill="#edbb77"/><rect x="490" y="270" width="200" height="140" rx="14" fill="#141e2b" stroke="#566476"/><text x="590" y="370" text-anchor="middle" class="small">6. Young stellar</text><text x="590" y="393" text-anchor="middle" class="small">system</text><ellipse cx="590" cy="313" rx="63" ry="13" fill="none" stroke="#79cbff" stroke-width="2"/><circle cx="590" cy="313" r="13" fill="#edbb77"/><circle cx="647" cy="318" r="5" fill="#a88ce9"/><text x="30" y="457" class="small muted">Read in numbered order. Shapes, sizes and timing are illustrative.</text><text x="30" y="482" class="small muted">The H–R track describes luminosity and surface temperature, not travel.</text></svg>