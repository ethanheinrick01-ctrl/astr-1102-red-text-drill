<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title"><title id="title">Size and surface temperature both matter</title><rect width="1000" height="530" rx="20" fill="#0c2018"/><g font-family="Arial, sans-serif"><text x="42" y="55" fill="#7edbb0" font-size="30" text-anchor="start">Size and surface temperature both matter</text><text x="500" y="138" fill="#ffd16f" font-size="39" text-anchor="middle">L / L☉ = (R / R☉)² × (T / T☉)⁴</text><rect x="60" y="188" width="420" height="215" rx="16" fill="#173326" stroke="#7edbb0"/><text x="270" y="232" fill="#7edbb0" font-size="25" text-anchor="middle">Change the radius</text><text x="270" y="297" fill="#e9f2ee" font-size="26" text-anchor="middle">2 × radius</text><text x="270" y="354" fill="#ffd16f" font-size="31" text-anchor="middle">4 × luminosity</text><rect x="520" y="188" width="420" height="215" rx="16" fill="#173326" stroke="#7edbb0"/><text x="730" y="232" fill="#7edbb0" font-size="25" text-anchor="middle">Change the temperature</text><text x="730" y="297" fill="#e9f2ee" font-size="26" text-anchor="middle">2 × temperature</text><text x="730" y="354" fill="#ffd16f" font-size="31" text-anchor="middle">16 × luminosity</text><text x="500" y="452" fill="#b4c6bd" font-size="24" text-anchor="middle">Hold the other quantity fixed for each comparison.</text><text x="42" y="500" fill="#b4c6bd" font-size="18" text-anchor="start">Original teaching diagram · conceptual relationships, not to scale</text></g></svg>