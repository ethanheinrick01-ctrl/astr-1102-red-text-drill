<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>Common envelope and possible outcomes</title><defs><radialGradient id="star" cx="32%" cy="25%"><stop stop-color="#fff4d2"/><stop offset=".45" stop-color="#f0a66a"/><stop offset=".85" stop-color="#9e4e45"/><stop offset="1" stop-color="#211b2d"/></radialGradient><radialGradient id="cold" cx="32%" cy="25%"><stop stop-color="#fff"/><stop offset=".5" stop-color="#9cc8e5"/><stop offset="1" stop-color="#19334f"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#72c5db"/></marker></defs><rect width="1000" height="600" fill="#0d171f"/><g fill="#dce8ee" font-family="Arial,sans-serif" font-size="22"><text x="35" y="45" font-size="28" fill="#dce8ee">Orbital energy can eject an envelope</text><ellipse cx="260" cy="280" rx="175" ry="120" fill="#ad795d" opacity=".4"/><circle cx="200" cy="280" r="25" fill="url(#cold)"/><circle cx="325" cy="280" r="20" fill="url(#cold)"/><path d="M450 255 Q570 140 675 180 M450 310 Q570 420 675 430" fill="none" stroke="#72c5db" stroke-width="3" marker-end="url(#arrow)"/><circle cx="755" cy="180" r="23" fill="url(#cold)"/><circle cx="815" cy="180" r="18" fill="url(#cold)"/><circle cx="785" cy="430" r="55" fill="url(#star)"/><text x="120" y="455" font-size="22" fill="#dce8ee">Drag → inward spiral</text><text x="675" y="100" font-size="22" fill="#dce8ee">Envelope expelled</text><text x="675" y="245" font-size="22" fill="#dce8ee">Close binary survives</text><text x="675" y="345" font-size="22" fill="#dce8ee">Inspiral continues</text><text x="680" y="530" font-size="22" fill="#dce8ee">Merger can result</text><text x="35" y="585" font-size="17" fill="#dce8ee">Two possible outcomes; a shared envelope alone does not select one.</text></g></svg>