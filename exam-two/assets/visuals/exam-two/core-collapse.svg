<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><radialGradient id="core"><stop stop-color="#fff"/><stop offset=".4" stop-color="#d4e9ff"/><stop offset="1" stop-color="#6789af"/></radialGradient><radialGradient id="gas"><stop stop-color="#0f171d"/><stop offset=".68" stop-color="#173847"/><stop offset=".82" stop-color="#5297ac"/><stop offset=".9" stop-color="#305c6e"/><stop offset="1" stop-color="#101820"/></radialGradient></defs><rect width="1000" height="640" rx="20" fill="#101820"/><g font-family="Arial,sans-serif"><text x="60" y="65" font-size="34" fill="#e8f0f5" text-anchor="start">Different masses, different support limits</text><text x="60" y="165" font-size="28" fill="#72d4e0" text-anchor="start">Initial massive star</text><text x="60" y="210" font-size="24" fill="#e8f0f5" text-anchor="start">Above about 8 solar masses</text><text x="60" y="310" font-size="28" fill="#f5bd6a" text-anchor="start">Electron-supported iron core</text><text x="60" y="355" font-size="24" fill="#e8f0f5" text-anchor="start">Limiting scale near 1.4 solar masses</text><text x="60" y="455" font-size="28" fill="#b79cda" text-anchor="start">Neutron-rich compact remnant</text><text x="60" y="500" font-size="24" fill="#e8f0f5" text-anchor="start">Also has a maximum supported mass</text><circle cx="795" cy="300" r="170" fill="#a4543b"/><circle cx="795" cy="300" r="62" fill="#c2d0dd"/><text x="795" y="570" font-size="26" fill="#a7bbc7" text-anchor="middle">Core ≠ whole progenitor</text></g></svg>