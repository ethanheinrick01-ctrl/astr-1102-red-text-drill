<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><radialGradient id="star" cx="35%" cy="30%"><stop stop-color="#fff6ce"/><stop offset=".6" stop-color="#ffc04f"/><stop offset="1" stop-color="#b84216"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#72d4e0"/></marker></defs><rect width="1000" height="640" rx="20" fill="#101820"/><g font-family="Arial,sans-serif" fill="#e9f1f5"><text x="75" y="75" font-size="38" fill="#e9f1f5" >Follow the net fuel and ash</text><text x="75" y="155" font-size="28" fill="#72d4e0" >Proton–proton</text><text x="75" y="200" font-size="30" fill="#e9f1f5" >Hydrogen → helium</text><text x="75" y="285" font-size="28" fill="#72d4e0" >CNO cycle</text><text x="75" y="330" font-size="28" fill="#e9f1f5" >Hydrogen → helium; C, N, O act as catalysts</text><text x="75" y="415" font-size="28" fill="#ffc765" >Triple-alpha</text><text x="75" y="460" font-size="26" fill="#e9f1f5" >Helium → carbon; further α capture can make oxygen</text><text x="75" y="555" font-size="23" fill="#a6bdca" >Temperature sensitivity in the supplied local model:</text><text x="75" y="600" font-size="28" fill="#e9f1f5" >pp: T⁴      CNO: T¹⁶      Triple-alpha: T⁴¹</text></g></svg>