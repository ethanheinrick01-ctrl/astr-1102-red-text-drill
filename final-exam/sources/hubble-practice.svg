<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Galaxies A, B and C at increasing distances from an observer"><rect width="1000" height="500" fill="#10151e"/><g font-family="system-ui" fill="#e4e9f1" text-anchor="middle"><text x="500" y="55" font-size="30">Distance from the observer</text><path d="M100 340H920M100 330V350M300 330V350M570 330V350M840 330V350" stroke="#7cc4ff" stroke-width="3"/><text x="100" y="390" font-size="25">Observer</text><text x="300" y="390" font-size="26">10 Mpc</text><text x="570" y="390" font-size="26">20 Mpc</text><text x="840" y="390" font-size="26">30 Mpc</text><text x="300" y="170" font-size="30">A</text><text x="570" y="170" font-size="30">B</text><text x="840" y="170" font-size="30">C</text><text x="500" y="460" font-size="22" fill="#b4c0d1">Original teaching diagram · schematic scale</text></g><g fill="#7cc4ff" stroke="#b4c0d1" stroke-width="2"><ellipse cx="300" cy="260" rx="65" ry="25" transform="rotate(-20 300 260)"/><ellipse cx="570" cy="260" rx="65" ry="25" transform="rotate(-20 570 260)"/><ellipse cx="840" cy="260" rx="65" ry="25" transform="rotate(-20 840 260)"/></g><g fill="#ffb78a"><circle cx="300" cy="260" r="10"/><circle cx="570" cy="260" r="10"/><circle cx="840" cy="260" r="10"/></g></svg>
